[package]
name = "embedded-tls"
version = "0.19.0"
edition = "2024"
description = "TLS 1.3 client with no_std support and no allocator"
documentation = "https://docs.rs/embedded-tls"
readme = "README.md"
homepage = "https://embassy.dev"
repository = "https://github.com/embassy-rs/embedded-tls"
license = "Apache-2.0"
keywords = ["embedded", "async", "tls", "no_std", "network"]
exclude = [".github"]

[package.metadata.docs.rs]
features = ["webpki", "rustpki", "rsa", "ed25519", "p256", "p384"]
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
embassy-crypto = { version = "0.1.0", git = "https://github.com/embassy-rs/embassy", rev = "9345ed463886cf964c0c33fc0af90a9ffbd4cb60" }
portable-atomic = { version = "1.6.0", default-features = false }
rsa = { version = "0.9.9", default-features = false, features = ["sha2"], optional = true }
heapless = { version = "0.9", default-features = false }
embedded-io = "0.7"
embedded-io-async = "0.7"
embedded-io-adapters = { version = "0.7", optional = true }
webpki = { package = "rustls-webpki", version = "0.101.7", default-features = false, optional = true }
der = { version = "0.8", features = ["derive", "oid", "heapless"] }

# Logging alternatives
log = { version = "0.4", optional = true }
defmt = { version = "1.0.1", optional = true }

[dev-dependencies]
embassy-crypto-rustcrypto = { version = "0.1.0", git = "https://github.com/embassy-rs/embassy", rev = "9345ed463886cf964c0c33fc0af90a9ffbd4cb60", features = ["all"] }
embassy-crypto-rand = { version = "0.1.0", git = "https://github.com/embassy-rs/embassy", rev = "9345ed463886cf964c0c33fc0af90a9ffbd4cb60" }
env_logger = "0.11"
tokio = { version = "1", features = ["full"] }
mio = { version = "0.8.3", features = ["os-poll", "net"] }
rustls = "0.21.6"
rustls-pemfile = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
pem-parser = "0.1.1"
openssl = "0.10.44"

[features]
# Server-side TLS 1.3 support. Off by default: client-only builds should not
# pay for the server handshake.
server = []
default = ["std", "log", "tokio"]
defmt = ["dep:defmt", "embedded-io/defmt", "heapless/defmt", "embassy-crypto/defmt"]
std = ["embedded-io/std", "embedded-io-async/std"]
tokio = ["embedded-io-adapters/tokio-1"]
# webpki's RSA support lives behind its `alloc` feature, which in 0.101 also needs its `std`.
alloc = ["webpki?/std"]
webpki = ["dep:webpki"]
rustpki = []
rsa = ["dep:rsa", "rustpki", "alloc"]
ed25519 = []
p256 = []
p384 = []
