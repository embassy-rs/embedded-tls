[package]
name = "embedded-tls-example-stm32h5"
version = "0.1.0"
edition = "2024"
resolver = "2"
publish = false

[[bin]]
name = "eth"
path = "src/main.rs"

[dependencies]
embedded-tls = { path = "../..", default-features = false, features = ["defmt"] }

embassy-stm32 = { version = "0.6.0", features = ["defmt", "stm32h563zi", "memory-x", "time-driver-any", "exti", "embassy-crypto-rng"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread", "defmt"] }
embassy-time = { version = "0.5.1", features = ["defmt", "defmt-timestamp-uptime", "tick-hz-32_768"] }
embassy-net = { version = "0.9.1", features = ["defmt", "tcp", "dhcpv4", "medium-ethernet"] }
embassy-crypto = { version = "0.1.0" }
embassy-crypto-rustcrypto = { version = "0.1.0", features = [
    "embassy-crypto-sha256",
    "embassy-crypto-hmac-sha256",
    "embassy-crypto-aes128-gcm",
    "embassy-crypto-p256-arith",
    "embassy-crypto-p256-ecdh",
] }

defmt = "1.0"
defmt-rtt = "1.0"
cortex-m = { version = "0.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "0.7"
embedded-io-async = "0.7"
panic-probe = { version = "1.0", features = ["print-defmt"] }
static_cell = "2"

[patch.crates-io]
embassy-stm32 = { git = "https://github.com/embassy-rs/embassy", rev = "822a76ea91f2c0885c6eb0c65fe91181e31133e1" }
embassy-executor = { git = "https://github.com/embassy-rs/embassy", rev = "822a76ea91f2c0885c6eb0c65fe91181e31133e1" }
embassy-time = { git = "https://github.com/embassy-rs/embassy", rev = "822a76ea91f2c0885c6eb0c65fe91181e31133e1" }
embassy-net = { git = "https://github.com/embassy-rs/embassy", rev = "822a76ea91f2c0885c6eb0c65fe91181e31133e1" }
embassy-crypto = { git = "https://github.com/embassy-rs/embassy", rev = "822a76ea91f2c0885c6eb0c65fe91181e31133e1" }
embassy-crypto-rustcrypto = { git = "https://github.com/embassy-rs/embassy", rev = "822a76ea91f2c0885c6eb0c65fe91181e31133e1" }

[profile.release]
codegen-units = 1
debug = 2
lto = 'fat'
opt-level = 's'
incremental = false
