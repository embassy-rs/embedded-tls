[package]
name = "ping-std"
version = "0.5.0"
edition = "2021"
authors = [
    "Bob McWhirter <bmcwhirt@redhat.com>",
    "Ulf Lilleengen <lulf@redhat.com>"
]

[dependencies]
embedded-tls = { path = "../..", features = ["log", "std", "webpki"], default-features = false }
embassy-crypto-rand = { git = "https://github.com/embassy-rs/embassy", rev = "9345ed463886cf964c0c33fc0af90a9ffbd4cb60" }
embassy-crypto-rustcrypto = { git = "https://github.com/embassy-rs/embassy", rev = "9345ed463886cf964c0c33fc0af90a9ffbd4cb60", features = ["embassy-crypto-sha256", "embassy-crypto-hmac-sha256", "embassy-crypto-aes128-gcm", "embassy-crypto-p256-ecdh", "embassy-crypto-p256-ecdsa"] }
embedded-io = { version = "0.7.0" }
embedded-io-adapters = { version = "0.7.0", features = ["std"] }
pem-parser = "0.1"
env_logger = "0.10"
log = "0.4"
