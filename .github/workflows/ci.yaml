name: CI

on:
  push:
    # Run on the main branch
    branches:
      - main
    # Releases are tags named 'v<version>', and must have the "major.minor.micro", for example: "0.1.0".
    # Release candidates are tagged as `v<version>-rc<num>`, for example: "0.1.0-rc1".
    tags:
      - "v*"
  # Also on PRs, just be careful not to publish anything
  pull_request:

jobs:
  library-ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        subcmd: [build, clippy, test]

    steps:
      - uses: actions/checkout@v4

      # The test certificates are generated rather than committed, so they
      # cannot silently expire. webpki_test include_str!s them, so they must
      # exist before anything is compiled.
      - name: Generate test certificates
        run: bash tests/data/gen_test_certs.sh

      - name: Run `cargo ${{ matrix.subcmd }}` for library
        run: cargo ${{ matrix.subcmd }} --features webpki

      - name: Run `cargo ${{ matrix.subcmd }}` for library with server
        run: cargo ${{ matrix.subcmd }} --features webpki,server,rustpki,p256

  example-ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example: [blocking, tokio, tokio-psk, embassy, blocking-server, tokio-server]

    steps:
      - uses: actions/checkout@v4

      - name: Run `cargo build` for example ${{ matrix.example }}
        working-directory: examples/${{ matrix.example }}
        run: cargo build
